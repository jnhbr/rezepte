<style>
:root{
  --bg:#faf5ec;--card:#fffdf8;--ink:#2a1d14;--mute:#8a7664;--line:#eadfce;
  --acc:#c2410c;--acc-d:#9a3412;--acc-l:#fde8d7;--ok:#4d7c0f;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1511;--card:#271d17;--ink:#f6ebdc;--mute:#a8927d;--line:#3a2d24;
  --acc:#f0813f;--acc-d:#f7a56e;--acc-l:#3b2417;--ok:#a3d15f;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}
header.top{padding:calc(22px + env(safe-area-inset-top)) 0 10px}
header.top h1{font-size:38px;line-height:1.05}
header.top h1 em{font-style:italic;color:var(--acc);font-weight:500}
header.top p{margin:6px 0 0;color:var(--mute);font-size:14px}
.search{display:flex;gap:8px;margin:14px 0 10px}
.search input{flex:1;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:none}
.search input:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-height:150px;position:relative}
.rc .hero{height:78px;display:flex;align-items:flex-end;padding:10px 12px;font-family:var(--serif);font-size:34px;font-weight:700;color:rgba(255,255,255,.92);line-height:1}
.rc .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.rc h3{font-size:17px;line-height:1.2}
.rc .meta{font-size:12.5px;color:var(--mute);margin-top:auto}
.rc .heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#9a3412;font-size:18px;line-height:1;cursor:pointer}
.rc .heart.on{color:#dc2626}
.rc .draft{position:absolute;top:10px;left:10px;background:#fff;color:var(--acc-d);font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.empty{text-align:center;color:var(--mute);padding:50px 20px;line-height:1.5}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);padding:4px 18px;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}
nav.tabs .badge{position:absolute;top:0;right:8px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
.fab{position:fixed;right:20px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:32px;line-height:1;box-shadow:0 8px 22px rgba(194,65,12,.4);cursor:pointer;z-index:19}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;overscroll-behavior:contain}
.sheet.in{animation:up .22s ease-out}
body.lock{overflow:hidden}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:2}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:12px;cursor:pointer;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.danger{color:#b91c1c}
.btn.sm{padding:6px 11px;font-size:13.5px}
.dh{height:150px;display:flex;align-items:flex-end;padding:18px;color:#fff}
.dh h1{font-size:32px;line-height:1.1;text-shadow:0 1px 14px rgba(0,0,0,.25)}
.sec{margin:22px 0 0}
.sec h2{font-size:22px;margin-bottom:10px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:12.5px;background:var(--acc-l);color:var(--acc-d);padding:4px 10px;border-radius:99px}
.port{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.port button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.port span{font-size:15px}
ul.zut{list-style:none;margin:0;padding:0}
ul.zut li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
ul.zut .m{min-width:78px;font-weight:600;color:var(--acc-d)}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;display:flex;gap:14px;padding:12px 0;line-height:1.5}
ol.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc-l);color:var(--acc-d);font-family:var(--serif);font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.note{background:var(--acc-l);border-radius:14px;padding:12px 14px;line-height:1.45;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
label.f{display:block;margin:16px 0 6px;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none;resize:vertical}
.in:focus{border-color:var(--acc)}
.hint{font-size:12.5px;color:var(--mute);margin-top:5px}
.shop-add{display:flex;gap:8px;margin:16px 0}
.shop-add input{flex:1}
.sl{list-style:none;margin:0;padding:0}
.sl li{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.sl .cb{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.sl li.done .cb{background:var(--ok);border-color:var(--ok)}
.sl li.done .t{text-decoration:line-through;color:var(--mute)}
.sl .src{display:block;font-size:12px;color:var(--mute)}
.cook{background:#1c1511;color:#f6ebdc;--card:#271d17;--line:#3a2d24;--mute:#a8927d;--acc-l:#3b2417;--acc-d:#f7a56e}
.cook .bar{background:rgba(28,21,17,.9)}
.cook .btn{background:#271d17;color:#f6ebdc;border-color:#3a2d24}
.cook ol.steps li{font-size:22px;line-height:1.45;padding:16px 0}
.cook ol.steps li.cur{color:#fff}
.cook ol.steps li:not(.cur){opacity:.55}
.cook ul.zut li{font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;animation:up .2s}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--ok)}
.rc .hero{height:96px}
.rc .hero.img{background-size:cover!important;background-position:center!important}
.fotoprev{height:150px;border-radius:14px;background:var(--acc-l) center/cover no-repeat;border:1px solid var(--line)}
.sortrow{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.sortrow select{flex:none;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px}
.sortrow .btn{flex:1;text-align:left}
.cat{font-family:var(--serif);font-size:19px;font-weight:700;margin:22px 0 2px;color:var(--acc-d)}
.rate{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.stars button{background:none;border:0;font-size:28px;color:var(--line);padding:0 2px;cursor:pointer}
.stars button.on,.stars .s.on{color:#f59e0b}
.stars .s{font-size:22px;color:var(--line)}
.da{margin-left:auto;font-size:11.5px;color:var(--ok);white-space:nowrap}
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vchips span{background:var(--acc-l);color:var(--acc-d);padding:6px 6px 6px 12px;border-radius:99px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.vchips b{cursor:pointer;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.08);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
#tbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:80;display:none;flex-direction:column;gap:8px}
#tbar .tm{display:flex;align-items:center;gap:12px;background:#1c1511;color:#f6ebdc;padding:12px 16px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
#tbar .tm span{flex:1}
#tbar .tm b{font-family:var(--serif);font-size:22px}
#tbar .tm.fin{background:var(--acc);color:#fff}
#tbar .tm i{font-style:normal;opacity:.6}

<body>
<div id="app"></div>

<script>
'use strict';
/* ============ Hilfen ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const UNITS=['kg','g','mg','l','dl','cl','ml','el','tl','stk','stk.','stück','prise','prisen','bund','dose','dosen','pkg','pkg.','päckchen','zehe','zehen','scheibe','scheiben','handvoll','becher','zweig','zweige'];
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};

function parseNum(s){
  s=s.trim().replace(',','.');
  if(FR[s])return FR[s];
  let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];
  m=s.match(/^(\d+)\s*([½¼¾⅓⅔])$/);if(m)return +m[1]+FR[m[2]];
  m=s.match(/^(\d+)\/(\d+)$/);if(m)return m[1]/m[2];
  m=s.match(/^\d+(\.\d+)?$/);if(m)return +s;
  return null;
}
function fmt(n){
  if(n==null)return '';
  const w=Math.floor(n+1e-9),f=n-w;
  const near=(a)=>Math.abs(f-a)<.04;
  const fr=near(.5)?'½':near(.25)?'¼':near(.75)?'¾':near(1/3)?'⅓':near(2/3)?'⅔':null;
  if(fr)return (w?w+' ':'')+fr;
  if(near(0)||near(1))return String(Math.round(n));
  return String(Math.round(n*10)/10).replace('.',',');
}
function parseZutat(line){
  line=line.trim().replace(/^[-•*]\s*/,'');
  if(!line)return null;
  const num='(?:\\d+\\s+\\d+\\/\\d+|\\d+\\s*[½¼¾⅓⅔]|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[½¼¾⅓⅔])';
  let m=line.match(new RegExp('^('+num+')(?:\\s*[-–]\\s*'+num+')?\\s*(.*)$'));
  let menge=null,rest=line;
  if(m){menge=parseNum(m[1]);rest=m[2];}
  let einheit='';
  const w=rest.match(/^(\S+)\s+(.*)$/)||rest.match(/^(\S+)$/);
  if(menge!=null&&w&&UNITS.includes(w[1].toLowerCase())){einheit=w[1];rest=w[2]||'';}
  else if(menge!=null){const g=rest.match(/^(kg|g|ml|dl|cl|l)\b\s*(.*)$/i);if(g){einheit=g[1];rest=g[2];}}
  return {m:menge,e:einheit,n:rest.trim()||line};
}
const zutatText=z=>[fmt(z.m),z.e,z.n].filter(Boolean).join(' ');
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const heroBg=r=>{const h=hue(r.titel||'?')%60+8;return `linear-gradient(135deg,hsl(${h} 70% 42%),hsl(${(h+28)%360} 65% 34%))`};

/* ============ Zutaten: Namen, Einheiten, Kategorien ============ */
const UF={kg:['g',1000],g:['g',1],l:['ml',1000],dl:['ml',100],cl:['ml',10],ml:['ml',1]};
const EX={eier:'ei',eiern:'ei',kartoffeln:'kartoffel',nudeln:'nudel',zwiebeln:'zwiebel',tomaten:'tomate',zitronen:'zitrone',limetten:'limette',karotten:'karotte',rüebli:'rüebli'};
function normName(n){
  let s=String(n||'').toLowerCase().replace(/\([^)]*\)/g,'').replace(/[,;].*$/,'').trim();
  s=s.replace(/^(frische[rnms]?|gehackte[rnms]?|geriebene[rnms]?|grosse[rnms]?|kleine[rnms]?|reife[rnms]?|mittelgrosse[rnms]?)\s+/,'');
  if(EX[s])return EX[s];
  if(/(eln|ern)$/.test(s)&&s.length>5)return s.slice(0,-1);
  if(/en$/.test(s)&&s.length>5)return s.slice(0,-1);
  return s;
}
function baseAmt(z){
  const e=(z.e||'').toLowerCase().replace('.','');
  if(UF[e])return {m:z.m==null?null:z.m*UF[e][1],u:UF[e][0]};
  if(['','stk','stück'].includes(e))return {m:z.m,u:''};
  return {m:z.m,u:e,ud:z.e};
}
function amountText(m,u,ud){
  if(m==null)return '';
  if(u==='g'&&m>=1000)return fmt(m/1000)+' kg';
  if(u==='ml'&&m>=1000)return fmt(m/1000)+' l';
  if(u==='ml'&&m>=100&&m%100===0)return fmt(m/100)+' dl';
  return [fmt(m),ud||u].filter(Boolean).join(' ');
}
const itemText=it=>[amountText(it.m,it.u,it.ud),it.name].filter(Boolean).join(' ');

const CATS=['Obst & Gemüse','Brot & Backwaren','Milch & Eier','Fleisch & Fisch','Trockenwaren & Konserven','Gewürze, Öle & Saucen','Tiefkühl','Getränke','Sonstiges'];
const KW=[
  ['Tiefkühl',/tiefkühl|glacé|(^|\s)eis(\s|$)|gefroren/],
  ['Gewürze, Öle & Saucen',/zitronensaft|limettensaft|erdnussbutter|chili ?crisp|salz|pfeffer|gewürz|paprikapulver|kurkuma|kümmel|zimt|muskat|oregano|thymian|rosmarin|curry|öl$|öl |essig|sauce|sosse|soße|senf|ketchup|mayo|sriracha|honig|zucker|sirup|miso|tahini|brühe|bouillon|vanille|backpulver|hefe|stärke|maizena|paste|harissa|pesto|sambal|gochujang/],
  ['Getränke',/wasser|wein|bier|saft|cola|prosecco|rum|likör|gin|vodka|kaffee|(^|\s)tee(\s|$)|hafer ?drink|sojadrink/],
  ['Trockenwaren & Konserven',/kokosmilch|mehl|nudel|spaghetti|pasta|penne|reis|udon|couscous|bulgur|linse|kichererbse|dose|konserve|passata|haferflocken|müesli|nuss|nüsse|mandel|cashew|erdnuss|sesam|schokolade|kokos|paniermehl|semmelbrösel|kapern|olive|polenta|griess|quinoa|cornflakes|tomatenmark|gehackte tomaten|gemüsebrühe/],
  ['Brot & Backwaren',/brot|brötchen|toast|tortilla|wrap|fladen|pita|baguette|gipfeli|blätterteig|pizzateig|teig|bun$/],
  ['Fleisch & Fisch',/fleisch|poulet|hähnchen|huhn|rind|schwein|hack|speck|schinken|wurst|salami|lachs|thon|fisch|garnele|crevette|shrimp|lamm|kalb|chorizo|pancetta/],
  ['Milch & Eier',/milch|rahm|butter|käse|mozzarella|parmesan|feta|halloumi|joghurt|quark|(^|\s)eier?(\s|$)|^ei$|eigelb|eiweiss|mascarpone|ricotta|crème|schmand|tofu|tempeh|burrata/],
  ['Obst & Gemüse',/zwiebel|knoblauch|tomate|gurke|salat|karotte|rüebli|möhre|kartoffel|paprika|peperoni|zucchini|aubergine|pilz|champignon|eierschwamm|spinat|lauch|brokkoli|blumenkohl|kohl|fenchel|sellerie|kürbis|ingwer|zitrone|limette|orange|apfel|birne|banane|beere|avocado|mango|kräuter|petersilie|basilikum|koriander|schnittlauch|dill|minze|rucola|mais|erbse|bohne|chili|rande|süsskartoffel|trauben|ananas|kiwi|pfirsich|gemüse|obst|salbei|knoblauchzehe/],
];
const BASE_TAGS=['Pasta','Reis','Suppe','Salat','Auflauf','Eintopf','Curry','Pizza & Flammkuchen','Burger & Sandwich','Bowl','Pfanne','Ofengericht','Grill','Brot & Gebäck','Dessert','Kuchen','Frühstück','Apéro & Snacks','Beilage','Sauce & Dip','Getränk','Vegi','Vegan','Fleisch','Geflügel','Fisch & Meeresfrüchte','Asiatisch','Italienisch','Mexikanisch','Orientalisch','Schweizerisch','Mediterran','Amerikanisch','Indisch','Schnell','Gäste','Meal Prep','Gesund','Comfort Food'];
const isBase=t=>BASE_TAGS.some(b=>b.toLowerCase()===t.toLowerCase());
const poolNames=()=>S.tagpool.map(t=>t.name);
function guessCat(name){const n=String(name||'').toLowerCase();for(const [c,re] of KW)if(re.test(n))return c;return 'Sonstiges'}

/* ============ Daten & Sync ============ */
const LS='rezepte-v1',LSC='rezepte-code',LSN='rezepte-ich';
const COLS=['rezepte','einkauf','vorrat','tagpool'];
let S={rezepte:[],einkauf:[],vorrat:[],tagpool:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'))}catch{}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch{toast('Speicher voll – bitte Rezepte sichern')}};
let fb={db:null,on:false,unsub:[]};

function dbPath(){const c=localStorage.getItem(LSC);return c?`haushalte/${c}`:null}
async function initSync(){
  fb.unsub.forEach(u=>u());fb.unsub=[];fb.on=false;
  const cfg=window.FIREBASE_CONFIG,path=dbPath();
  if(!cfg||!path){renderSafe();return}
  try{
    if(!window.firebase){
      for(const f of['app','firestore'])await new Promise((ok,no)=>{const s=document.createElement('script');s.src=`https://www.gstatic.com/firebasejs/10.12.0/firebase-${f}-compat.js`;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    }
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    fb.db=firebase.firestore();
    for(const col of COLS){
      S[col].forEach(x=>fb.db.doc(`${path}/${col}/${x.id}`).set(x,{merge:true}));
      fb.unsub.push(fb.db.collection(`${path}/${col}`).onSnapshot(snap=>{
        let ch=false;
        snap.docChanges().forEach(c=>{
          const d=c.doc.data(),i=S[col].findIndex(x=>x.id===d.id);
          if(c.type==='removed'){if(i>=0){S[col].splice(i,1);ch=true}}
          else if(i<0){S[col].push(d);ch=true}
          else if((d.updated||0)>(S[col][i].updated||0)){S[col][i]=d;ch=true}
        });
        if(ch){save();cleanTags();renderSafe()}
        fb.on=true;
      },e=>{fb.on=false;console.warn(e);renderSafe()}));
    }
    fb.on=true;
  }catch(e){console.warn('Sync nicht verfügbar',e);fb.on=false}
  renderSafe();
}
function put(col,item){
  item.updated=Date.now();
  const i=S[col].findIndex(x=>x.id===item.id);
  if(i<0)S[col].push(item);else S[col][i]=item;
  save();
  const p=dbPath();if(fb.db&&p)fb.db.doc(`${p}/${col}/${item.id}`).set(item).catch(console.warn);
}
function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);save();
  const p=dbPath();if(fb.db&&p)fb.db.doc(`${p}/${col}/${id}`).delete().catch(console.warn);
}

/* ============ Tags aufräumen (Gross/Klein, Doppelte) ============ */
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
function dedupeTags(list){
  const out=[];(list||[]).forEach(t=>{t=cap1(String(t).trim());if(t&&!out.some(o=>o.toLowerCase()===t.toLowerCase()))out.push(t)});return out;
}
function cleanTags(){
  S.rezepte.forEach(r=>{
    const n=dedupeTags(r.tags);
    if(JSON.stringify(n)!==JSON.stringify(r.tags||[])){r.tags=n;put('rezepte',r)}
  });
}

function addPool(name){
  name=cap1(String(name).trim());
  if(!name||isBase(name)||S.tagpool.some(t=>t.name.toLowerCase()===name.toLowerCase()))return;
  put('tagpool',{id:uid(),name});
}
function renameTag(old,nw){
  nw=cap1(String(nw).trim());if(!nw||nw.toLowerCase()===old.toLowerCase()&&nw===old)return;
  const lo=old.toLowerCase();
  S.rezepte.forEach(r=>{if((r.tags||[]).some(t=>t.toLowerCase()===lo)){r.tags=dedupeTags(r.tags.map(t=>t.toLowerCase()===lo?nw:t));put('rezepte',r)}});
  S.tagpool.filter(t=>t.name.toLowerCase()===lo).forEach(t=>del('tagpool',t.id));
  addPool(nw);
}
function deleteTag(tag){
  const lo=tag.toLowerCase();
  S.rezepte.forEach(r=>{if((r.tags||[]).some(t=>t.toLowerCase()===lo)){r.tags=r.tags.filter(t=>t.toLowerCase()!==lo);put('rezepte',r)}});
  S.tagpool.filter(t=>t.name.toLowerCase()===lo).forEach(t=>del('tagpool',t.id));
}
async function retagAll(){
  const code=localStorage.getItem(LSC);
  if(!code||!window.RECIPE_WORKER){toast('Dafür braucht es den Zugangscode und den KI-Dienst');return}
  const list=S.rezepte.filter(r=>!r.entwurf&&((r.zutaten||[]).length||(r.schritte||[]).length));
  if(!list.length){toast('Keine Rezepte zum Einordnen');return}
  if(!confirm(`${list.length} Rezepte von der KI einordnen lassen? Kostet ungefähr ${Math.max(1,Math.round(list.length*.4))} Rappen. Du kannst das Ergebnis danach prüfen.`))return;
  const props=[];
  try{
    for(let i=0;i<list.length;i+=12){
      toast(`Ordne ein … ${Math.min(i+12,list.length)}/${list.length}`);
      const batch=list.slice(i,i+12).map(r=>({id:r.id,titel:r.titel,zutaten:(r.zutaten||[]).slice(0,25).map(zutatText),tags:r.tags||[]}));
      const res=await fetch(window.RECIPE_WORKER,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,retag:batch,pool:poolNames()})});
      const d=await res.json();
      if(d.fehler){toast(d.fehler);return}
      (d.ergebnisse||[]).forEach(e=>{
        const r=S.rezepte.find(x=>x.id===e.id);if(!r)return;
        const alt=r.tags||[],neu=dedupeTags(e.tags||[]);
        const gleich=JSON.stringify([...alt].sort())===JSON.stringify([...neu].sort())&&!e.neuerTag;
        props.push({id:r.id,titel:r.titel,alt,neu,neuerTag:e.neuerTag||'',on:!gleich,gleich});
      });
    }
  }catch{toast('Keine Verbindung zum KI-Dienst');return}
  view={type:'retag',id:'x',props};render();
}

function stepTime(s){

  return {sec:n*60,label:n+' Min'};
}

    <div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-a="pickfoto">Foto wählen</button><button type="button" class="btn sm" data-a="rmfoto">Entfernen</button></div>
    <input type="file" id="foto" accept="image/*" hidden>
    <label class="f">Titel</label><input class="in" name="titel" required value="${esc(r.titel)}">
    <label class="f">Portionen</label><input class="in" name="portionen" type="number" min="1" inputmode="numeric" value="${r.portionen||2}">
    <label class="f">Zutaten (eine pro Zeile)</label>
    <textarea class="in" name="zutaten" rows="7" placeholder="200 g Mehl&#10;2 Eier&#10;1 TL Salz">${esc((r.zutaten||[]).map(zutatText).join('\n'))}</textarea>
    <div class="hint">Menge und Einheit zuerst, dann die Zutat – so kann die App Portionen umrechnen.</div>
    <label class="f">Zubereitung (ein Schritt pro Zeile)</label>
    <textarea class="in" name="schritte" rows="7">${esc((r.schritte||[]).join('\n'))}</textarea>
    <label class="f">Tags (mit Komma trennen)</label><input class="in" name="tags" value="${esc((r.tags||[]).join(', '))}" placeholder="Vegi, Schnell, Pasta">
    <label class="f">Link zum Reel</label><input class="in" name="link" type="url" inputmode="url" value="${esc(r.link||'')}" placeholder="https://www.instagram.com/…">
    <label class="f">Notizen</label><textarea class="in" name="notiz" rows="3" placeholder="Nächstes Mal weniger Salz …">${esc(r.notiz||'')}</textarea>
    ${r.id?'<div class="row"><button type="button" class="btn danger" data-a="delrec">Rezept löschen</button></div>':''}
  </div></form></div>`;
}

/* ============ Aktionen ============ */
let wl=null;
async function wake(on){try{if(on&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen');else if(wl){await wl.release();wl=null}}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view?.type==='cook')wake(true)});

// Eine Zutat zur Einkaufsliste: fasst gleiche Zutaten zusammen, überspringt Vorrat
function addIng(z,von,kat){
  const nk=normName(z.n);
  if(!nk)return 'skip';
  if(S.vorrat.some(v=>v.key===nk))return 'vorrat';
  const b=baseAmt(z),key=nk+'|'+b.u;
  const ex=S.einkauf.find(x=>!x.done&&x.key===key);
  if(ex){
    if(ex.m!=null&&b.m!=null)ex.m+=b.m;
    else if(ex.m==null&&b.m!=null)ex.m=b.m;
    if(von&&!(ex.von||'').includes(von))ex.von=(ex.von?ex.von+', ':'')+von;
    ex.text=itemText(ex);put('einkauf',ex);return 'merge';
  }
  const it={id:uid(),name:z.n,key,m:b.m,u:b.u,ud:b.ud,kat:kat||guessCat(z.n+' '+(z.e||'')),done:false,von:von||''};
  it.text=itemText(it);put('einkauf',it);return 'neu';
}
function addToShop(r){
  let n=0,v=0;
  scaled(r).forEach(z=>{const res=addIng(z,r.titel,(r.kat||{})[normName(z.n)]);if(res==='vorrat')v++;else if(res!=='skip')n++});
  toast(`${n} Zutaten hinzugefügt${v?` · ${v} schon im Vorrat`:''}`);
}
function saveForm(f){
  const d=new FormData(f),old=S.rezepte.find(x=>x.id===view.id);
  const r=Object.assign(old||{id:uid()},{
    titel:d.get('titel').trim(),
    portionen:Math.max(1,+d.get('portionen')||2),
    zutaten:d.get('zutaten').split('\n').map(parseZutat).filter(Boolean),
    schritte:d.get('schritte').split('\n').map(s=>s.trim().replace(/^\d+[.)]\s*/,'')).filter(Boolean),
    tags:dedupeTags(d.get('tags').split(',')),
    link:d.get('link').trim(),notiz:d.get('notiz').trim()
  });
  if('bild' in view){if(view.bild)r.bild=view.bild;else delete r.bild}
  if(view.kat)r.kat=Object.assign({},r.kat,view.kat);
  if(r.zutaten.length||r.schritte.length)delete r.entwurf;
  put('rezepte',r);
  view={type:'detail',id:r.id};
}

/* Timer */
let timers=[],audio=null;
function beep(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();[0,.4,.8].forEach(t=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);const T=audio.currentTime+t;g.gain.setValueAtTime(.3,T);g.gain.exponentialRampToValueAtTime(.001,T+.3);o.start(T);o.stop(T+.3)})}catch{}}
function tickTimers(){
  const bar=$('#tbar'),now=Date.now();
  timers.forEach(t=>{if(!t.done&&now>=t.end){t.done=true;beep();if(navigator.vibrate)navigator.vibrate([300,150,300]);toast('⏰ Fertig: '+t.label)}});
  bar.innerHTML=timers.map(t=>{const s=Math.max(0,Math.round((t.end-now)/1000));return `<div class="tm ${t.done?'fin':''}" data-a="tstop" data-v="${t.id}"><span>${esc(t.label)}</span><b>${t.done?'Fertig ✓':Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}</b><i>✕</i></div>`}).join('');
  bar.style.display=timers.length?'flex':'none';
}
setInterval(tickTimers,1000);

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el||el.tagName==='FORM')return;
  const a=el.dataset.a,v=el.dataset.v;
  const r=view&&S.rezepte.find(x=>x.id===view.id);
  switch(a){
    case 'tab':tab=v;break;
    case 'tag':tagF=v;favF=false;break;
    case 'favf':favF=!favF;tagF='';break;
    case 'fav':{const x=S.rezepte.find(i=>i.id===v);if(x){x.fav=!x.fav;put('rezepte',x);toast(x.fav?'Zu Favoriten hinzugefügt':'Aus Favoriten entfernt')}break}
    case 'rand':{const c=filtered().filter(x=>!x.entwurf);if(!c.length){toast('Noch kein passendes Rezept');return}view={type:'detail',id:c[Math.floor(Math.random()*c.length)].id};break}
    case 'new':view={type:'edit',id:null};break;
    case 'open':view={type:'detail',id:v};break;
    case 'close':view=view.id&&S.rezepte.find(x=>x.id===view.id)&&view.type==='edit'?{type:'detail',id:view.id}:null;break;
    case 'edit':view={type:'edit',id:view.id};break;
    case 'pm':view.portionen=Math.max(1,(view.portionen||r.portionen||1)+ +v);break;
    case 'toshop':addToShop(r);break;
    case 'cook':view={type:'cook',id:view.id,portionen:view.portionen,step:0};wake(true);break;
    case 'uncook':wake(false);view={type:'detail',id:view.id,portionen:view.portionen};break;
    case 'step':view.step=+v;break;
    case 'stepnext':view.step=Math.min((r.schritte||[]).length-1,(view.step||0)+1);break;
    case 'timer':{const t=stepTime(r.schritte[+v]);if(!t)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)()}catch{}timers.push({id:uid(),label:`${r.titel}: ${t.label}`,end:Date.now()+t.sec*1000});tickTimers();toast('Timer gestartet');return}
    case 'tstop':timers=timers.filter(t=>t.id!==v);tickTimers();return;
    case 'star':{let me=ich();if(!me){me=(prompt('Wie heisst du? (damit eure Bewertungen getrennt bleiben)')||'').trim();if(!me)return;localStorage.setItem(LSN,me)}r.bew=r.bew||{};if(r.bew[me]===+v)delete r.bew[me];else r.bew[me]=+v;put('rezepte',r);break}
    case 'cooked':r.gek=(r.gek||[]).concat(Date.now());put('rezepte',r);toast('Eingetragen – guten Appetit!');break;
    case 'uncooked':r.gek=(r.gek||[]).slice(0,-1);put('rezepte',r);break;
    case 'delrec':if(confirm('Rezept wirklich löschen?')){del('rezepte',view.id);view=null}else return;break;
    case 'check':{const x=S.einkauf.find(i=>i.id===v);if(x){x.done=!x.done;put('einkauf',x)}break}
    case 'cleardone':S.einkauf.filter(x=>x.done).forEach(x=>del('einkauf',x.id));break;
    case 'savename':{const n=$('#name').value.trim();n?localStorage.setItem(LSN,n):localStorage.removeItem(LSN);toast('Gespeichert');return}
    case 'tagren':{const n=prompt(`Neuer Name für «${v}»? Gibt es den Namen schon, werden beide zusammengeführt.`,v);if(!n)return;renameTag(v,n);break}
    case 'tagdel':if(confirm(`Tag «${v}» von allen Rezepten entfernen?`)){deleteTag(v)}else return;break;
    case 'retag':retagAll();return;
    case 'rtoggle':{const p=view.props.find(x=>x.id===v);if(p)p.on=!p.on;break}
    case 'rapply':{let n=0;view.props.filter(p=>p.on).forEach(p=>{const r=S.rezepte.find(x=>x.id===p.id);if(!r)return;r.tags=dedupeTags([...p.neu,...(p.neuerTag?[p.neuerTag]:[])]);if(p.neuerTag)addPool(p.neuerTag);put('rezepte',r);n++});toast(`${n} Rezepte aktualisiert`);view=null;break}
    case 'acceptTag':{addPool(v);const f=$('form[data-a="saveform"]');f.tags.value=dedupeTags([...f.tags.value.split(','),v]).join(', ');$('#kisug').innerHTML='';return}
    case 'vdel':del('vorrat',v);break;
    case 'vbasics':['Salz','Pfeffer','Zucker','Mehl','Olivenöl','Öl','Essig','Butter','Wasser'].forEach(n=>{const k=normName(n);if(!S.vorrat.some(x=>x.key===k))put('vorrat',{id:uid(),name:n,key:k})});break;
    case 'savecode':{const c=$('#code').value.trim();c?localStorage.setItem(LSC,c):localStorage.removeItem(LSC);toast(window.FIREBASE_CONFIG?'Code gespeichert':'Code gespeichert – Sync braucht noch die Firebase-Einrichtung');initSync();return}
    case 'export':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='rezepte-sicherung.json';u.click();return}
    case 'import':$('#file').click();return;
    case 'pickimg':$('#kiimg').click();return;
    case 'pickfoto':$('#foto').click();return;
    case 'rmfoto':view.bild='';$('#fotoprev').style.backgroundImage='';return;
    case 'ki':kiFill();return;
    default:return;
  }
  render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const a=e.target.dataset.a;
  if(a==='saveform'){saveForm(e.target);render()}
  if(a==='shopadd'){const t=$('#shopin').value.trim();if(t){const z=parseZutat(t);const res=addIng(z,'');if(res==='vorrat')toast('Ist schon im Vorrat');render();$('#shopin').focus()}}
  if(a==='vadd'){const t=$('#vin').value.trim();if(t&&!S.vorrat.some(x=>x.key===normName(t)))put('vorrat',{id:uid(),name:t,key:normName(t)});render()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='sort'){sortF=e.target.value;render()}
  if(e.target.id==='kiimg'){try{kiImage=await shrink(e.target.files[0]);$('#kistat').textContent='Screenshot bereit – auf «Ausfüllen» tippen.'}catch{}}
  if(e.target.id==='foto'){try{view.bild=await shrink(e.target.files[0],560,.7);$('#fotoprev').style.backgroundImage=`url(${view.bild})`}catch{}}
  if(e.target.id==='file'){
    try{const d=JSON.parse(await e.target.files[0].text());
      COLS.forEach(c=>(d[c]||[]).forEach(x=>{if(!S[c].some(y=>y.id===x.id))put(c,x)}));
      cleanTags();toast('Importiert');render()}catch{toast('Datei konnte nicht gelesen werden')}
  }
});

/* ============ KI-Import ============ */
let kiImage=null;
function shrink(file,max=1400,qual=.82){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',qual))};im.onerror=no;im.src=typeof file==='string'?file:URL.createObjectURL(file)})}
async function kiFill(){
  const st=$('#kistat'),f=$('form[data-a="saveform"]');
  const code=localStorage.getItem(LSC);
  if(!code){st.textContent='Bitte zuerst unter «Mehr» den Zugangscode eintragen.';return}
  const text=$('#kitext').value.trim(),link=f.link.value.trim();
  if(!text&&!kiImage&&!link){st.textContent='Füge Text ein, wähle einen Screenshot oder trage einen Link ein.';return}
  st.textContent='Lese Rezept … (ca. 10 Sekunden)';
  try{
    const res=await fetch(window.RECIPE_WORKER,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,text,image:kiImage,link,pool:poolNames()})});
    const d=await res.json();
    if(d.fehler){st.textContent=d.fehler;return}
    f.titel.value=d.titel||f.titel.value;
    f.portionen.value=d.portionen||f.portionen.value;
    const zl=(d.zutaten||[]);
    f.zutaten.value=zl.join('\n');
    f.schritte.value=(d.schritte||[]).join('\n');
    f.tags.value=dedupeTags(d.tags||[]).join(', ');
    view.kat={};
    zl.forEach((z,i)=>{const p=parseZutat(z);if(p&&d.kategorien&&CATS.includes(d.kategorien[i]))view.kat[normName(p.n)]=d.kategorien[i]});
    const hatBild='bild' in view?view.bild:(S.rezepte.find(x=>x.id===view.id)||{}).bild;
    if(d.bild&&!hatBild){try{view.bild=await shrink(d.bild,560,.7);$('#fotoprev').style.backgroundImage=`url(${view.bild})`}catch{}}
    $('#kisug').innerHTML=d.neuerTag?`<div class="hint" style="margin-top:8px">Kein passender Tag in der Liste. Neuen Tag anlegen?</div><button type="button" class="btn sm" style="margin-top:6px" data-a="acceptTag" data-v="${esc(d.neuerTag)}">+ ${esc(d.neuerTag)}</button>`:'';
    st.textContent='Fertig – bitte kurz prüfen und speichern.';
  }catch{st.textContent='Keine Verbindung zum KI-Dienst.'}
}

/* ============ Teilen-Eingang (Kurzbefehl) ============ */
function intake(){
  const p=new URLSearchParams(location.search);
  const link=p.get('link')||(p.get('text')||'').match(/https?:\/\/\S+/)?.[0];
  if(!link)return;
  if(!S.rezepte.some(r=>r.link===link))put('rezepte',{id:uid(),titel:'Neues Rezept',portionen:2,zutaten:[],schritte:[],tags:[],link,notiz:'',entwurf:true});
  history.replaceState(null,'',location.pathname);
  tab='rezepte';
  const r=S.rezepte.find(r=>r.link===link);
  const cap=(p.get('caption')||'').trim();
  view={type:'edit',id:r.id,auto:true,caption:/^https?:\/\/\S+$/.test(cap)?'':cap};
}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
cleanTags();
intake();render();
if(view&&view.auto){view.auto=false;kiFill()}
initSync();
</script>
